global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'neoforge-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/api/v1/monitoring/metrics/prometheus'
    scrape_interval: 30s
    basic_auth:
      username: 'monitoring'
      password: '${MONITORING_PASSWORD}'

  - job_name: 'neoforge-health'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/api/v1/monitoring/health/system'
    scrape_interval: 60s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']