<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoForge Vanilla Test</title>
</head>
<body>
    <h1>Vanilla JavaScript NeoApp Test</h1>
    <neo-app></neo-app>

    <script>
        // Simple vanilla JavaScript component
        class NeoApp extends HTMLElement {
            constructor() {
                super();
                this.innerHTML = `
                    <div class="app">
                        <header>
                            <a href="/" class="logo">NeoForge</a>
                        </header>
                        <main id="router-outlet">
                            <div style="text-align: center; padding: 2rem;">
                                <h2>Welcome to NeoForge</h2>
                                <p>The router outlet is ready!</p>
                                <p><a href="/register">Go to Registration</a></p>
                            </div>
                        </main>
                        <footer>
                            <p>&copy; 2024 NeoForge</p>
                        </footer>
                    </div>
                `;
            }
        }

        customElements.define('neo-app', NeoApp);
        console.log('Vanilla NeoApp component registered successfully');

        // Test after component is registered
        setTimeout(() => {
            const neoApp = document.querySelector('neo-app');
            console.log('NeoApp element:', neoApp);
            console.log('Custom element defined:', customElements.get('neo-app') !== undefined);

            if (neoApp) {
                const routerOutlet = neoApp.querySelector('#router-outlet');
                console.log('Router outlet:', routerOutlet);
                console.log('Router outlet content:', routerOutlet ? routerOutlet.innerHTML : 'N/A');

                const header = neoApp.querySelector('header');
                const footer = neoApp.querySelector('footer');
                console.log('Header:', header);
                console.log('Footer:', footer);
            }
        }, 100);
    </script>
</body>
</html>
